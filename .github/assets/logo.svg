<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" role="img" aria-label="ErrorAlign logo">
  <style>
    text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 48px;
      font-weight: bold;
    }
  </style>

  <defs>
    <linearGradient id="error-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9e1414"/>
      <stop offset="100%" stop-color="#e0735a"/>
    </linearGradient>
    <linearGradient id="align-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d7a0a"/>
      <stop offset="100%" stop-color="#a6c95e"/>
    </linearGradient>
    <linearGradient id="block-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2c2c2"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
  </defs>

  <!-- Centered group: 6 chars + gap, ~28.8px per char -->
  <g transform="translate(180, 60)">
    <!-- Line 1: "error" + gap + grey space -->
    <text x="-92" y="-10" text-anchor="start" fill="url(#error-gradient)">error</text>
    <rect x="61" y="-46" width="28.8" height="42" rx="2" fill="url(#block-gradient)"/>

    <!-- Line 2: grey space + gap + "align" -->
    <rect x="-89.8" y="2" width="28.8" height="42" rx="2" fill="url(#block-gradient)"/>
    <text x="-52" y="38" text-anchor="start" fill="url(#align-gradient)">align</text>
  </g>
</svg>
